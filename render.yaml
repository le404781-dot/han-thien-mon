services:
  - type: web
    name: han-thien-mon
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TIEN_DAO_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TIEN_DAO_TIMEOUT_MS
        value: "25000"
