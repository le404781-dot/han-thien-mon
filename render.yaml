services:
  - type: web
    name: han-thien-mon
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: han-thien-mon-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: han-thien-mon-db
